  .detail-panel{background:var(--surface-alt);border-radius:var(--radius-s);padding:10px 14px;margin:-4px 0 10px;}

  .cred-block h3{margin:0 0 10px;font-size:14.5px;}
  .grade-card{text-align:center;}
  .grade-letter{font-family:'Fraunces',serif;font-size:56px;font-weight:700;color:var(--teal-dark);line-height:1;}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const SCHOOL_NAME = "SMP Tahfizhpreneur Cahaya Qur'an";

/* ---------------- Firebase ---------------- */

  apiKey: "AIzaSyDiwK8w0eudyNfS8WEfMcgqqWTU80CmYr0",

function fbKey(key){ return String(key).replace(/[.#$\[\]]/g,'_'); }

/* ---------------- Storage layer ---------------- */
// Data bersama (shared=true, default) disimpan di Firebase Realtime Database
// supaya admin/orang tua/santri melihat data yang sama dan sinkron antar device.
// Data privat per-device (shared=false, mis. "ingat login") disimpan di localStorage.
async function storeGet(key, shared=true){
  if(!shared){
    try{
      const raw = localStorage.getItem('p:'+key);
      return raw===null ? null : JSON.parse(raw);
    }catch(e){ return null; }
  }
  try{
    const snap = await get(ref(db, 'amaliyah/'+fbKey(key)));
    return snap.exists() ? snap.val() : null;
  }catch(e){
    console.error('storeGet error', key, e);
    return null;
  }
}
async function storeSet(key, value, shared=true){
  if(!shared){
    try{ localStorage.setItem('p:'+key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  try{
    await set(ref(db, 'amaliyah/'+fbKey(key)), value);
    return true;
  }catch(e){
    console.error('storeSet error', key, e);
    return false;
  }
}

let state = {

function pad(n){ return n.toString().padStart(2,'0'); }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function currentYm(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function checklistKey(dateKey){ return `checklist-${dateKey}`; }
function fmtDateLong(){ return new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(iso){ return new Date(iso).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'),1800);
}
function gradeLetter(pct){ if(pct>=90) return 'A'; if(pct>=75) return 'B'; if(pct>=60) return 'C'; return 'D'; }
function gradeDesc(letter){
  if(letter==='A') return 'Sangat Rajin';
  if(letter==='B') return 'Rajin';
  if(letter==='C') return 'Cukup';
  return 'Perlu Ditingkatkan';
}

/* ---------------- Laporan WA ---------------- */
const MONTH_NAMES_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function monthLabelId(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${MONTH_NAMES_ID[m-1]} ${y}`;
}
async function copyToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function waGreeting(){ return "Assalamu'alaikum warahmatullahi wabarakatuh,"; }
function waClosing(){ return "Semoga catatan ini menjadi motivasi bagi ananda untuk terus istiqomah dalam amaliyah hariannya. Jazakumullahu khairan atas kerja sama dan dukungan Ayah/Bunda.\n\nWassalamu'alaikum warahmatullahi wabarakatuh."; }
function buildAdminWaReport(rows, ym){
  const label = monthLabelId(ym);
  const banin = rows.filter(r=>r.group==='banin');
  const banat = rows.filter(r=>r.group==='banat');
  const fmtRow = (r,i)=>{
    const letter = gradeLetter(r.pct);
    return `${i+1}. ${r.name} — ${r.doneSum}/${r.maxPossible} amaliyah (${r.pct}%) — Nilai ${letter} (${gradeDesc(letter)})`;
  };
  const lines = [];
  lines.push('LAPORAN PERKEMBANGAN AMALIYAH HARIAN SANTRI');
  lines.push(SCHOOL_NAME);
  lines.push(`Bulan: ${label}`);
  lines.push('');
  lines.push(waGreeting());
  lines.push('');
  lines.push(`Berikut kami sampaikan laporan perkembangan amaliyah harian santri selama bulan ${label}:`);
  lines.push('');
  const baninTop = banin.find(r=>r.pct>0);
  const banatTop = banat.find(r=>r.pct>0);
  if(baninTop || banatTop){
    lines.push('🌟 Santri Teladan:');
    if(baninTop) lines.push(`   Banin — ${baninTop.name} (${baninTop.pct}%)`);
    if(banatTop) lines.push(`   Banat — ${banatTop.name} (${banatTop.pct}%)`);
    lines.push('');
  }
  if(banin.length){
    lines.push('BANIN');
    banin.forEach((r,i)=> lines.push(fmtRow(r,i)));
    lines.push('');
  }
  if(banat.length){
    lines.push('BANAT');
    banat.forEach((r,i)=> lines.push(fmtRow(r,i)));
    lines.push('');
  }
  lines.push(waClosing());
  return lines.join('\n');
}
function buildAdminWeeklyWaReport(rows, mondayIso){

  if(banin.length){

    banat.forEach((r,i)=> lines.push(fmtRow(r,i)));
    lines.push('');
  }
  lines.push(waClosing());
  return lines.join('\n');
}
function buildStudentWaReport(student, row, period, periodValue){
  const label = period==='mingguan' ? weekRangeLabel(periodValue) : monthLabelId(periodValue);
  const periodWord = period==='mingguan' ? 'minggu' : 'bulan';
  const lines = [];
  lines.push('LAPORAN PERKEMBANGAN AMALIYAH HARIAN SANTRI');
  lines.push(SCHOOL_NAME);

  lines.push('');
  lines.push(waGreeting());
  lines.push('');

    lines.push(`Ananda ${student.name} telah menyelesaikan ${row.doneSum}/${row.maxPossible} amaliyah harian selama ${periodWord} ${label} (${row.pct}%), dengan predikat ${letter} (${gradeDesc(letter)}).`);
  } else {

  lines.push(waClosing());
  return lines.join('\n');
}

function classAnalytics(rows, group){
  const list = rows.filter(r=>r.group===group);
  const n = list.length;
  const avgPct = n ? Math.round(list.reduce((a,r)=>a+r.pct,0)/n*10)/10 : 0;
  const active = list.filter(r=>r.doneSum>0).length;
  const top = list.length && list[0].pct>0 ? list[0] : null;
  return { group, n, avgPct, active, letter: gradeLetter(avgPct), top };
}

async function computeMonthly(yearMonth){
  const [year, month] = yearMonth.split('-').map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();
  const now = new Date();
  const isCurrent = now.getFullYear()===year && (now.getMonth()+1)===month;
  const lastDay = isCurrent ? now.getDate() : daysInMonth;
  const totals = {};
  state.students.forEach(s=> totals[s.id]=0);
  const keys = [];
  for(let d=1; d<=lastDay; d++){ keys.push(`${year}-${pad(month)}-${pad(d)}`); }
  const results = await Promise.all(keys.map(k=> storeGet(checklistKey(k))));
  results.forEach(obj=>{
    if(!obj) return;
    Object.keys(obj).forEach(sid=>{
      if(totals[sid]===undefined) totals[sid]=0;
      totals[sid] += Object.keys(obj[sid]||{}).length;
    });
  });
  const rows = state.students.map(s=>{
    const total = tasksByGroup(s.group).length;
    const maxPossible = lastDay * (total||1);
    const doneSum = totals[s.id]||0;
    const pct = maxPossible ? Math.round(doneSum/maxPossible*1000)/10 : 0;
    return {...s, doneSum, maxPossible, pct};
  });
  rows.sort((a,b)=> b.pct-a.pct || a.name.localeCompare(b.name));
  return { rows, lastDay };
}
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return dateKey(d);
}
function weekRangeLabel(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate()+6);
  const fmt = (d)=> d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  return `${fmt(start)} – ${fmt(end)}`;
}
async function computeWeekly(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  const now = new Date();
  const keys = [];
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if(d > now) break;
    keys.push(dateKey(d));
  }
  const lastDay = keys.length || 1;
  const totals = {};
  state.students.forEach(s=> totals[s.id]=0);
  const results = await Promise.all(keys.map(k=> storeGet(checklistKey(k))));
  results.forEach(obj=>{
    if(!obj) return;
    Object.keys(obj).forEach(sid=>{
      if(totals[sid]===undefined) totals[sid]=0;
      totals[sid] += Object.keys(obj[sid]||{}).length;
    });
  });
  const rows = state.students.map(s=>{
    const total = tasksByGroup(s.group).length;
    const maxPossible = lastDay * (total||1);
    const doneSum = totals[s.id]||0;
    const pct = maxPossible ? Math.round(doneSum/maxPossible*1000)/10 : 0;
    return {...s, doneSum, maxPossible, pct};
  });
  rows.sort((a,b)=> b.pct-a.pct || a.name.localeCompare(b.name));
  return { rows, lastDay };
}
function keysForPeriod(period, periodValue){
  if(period==='mingguan'){
    const start = new Date(periodValue+'T00:00:00');
    const now = new Date();
    const keys = [];
    for(let i=0;i<7;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      if(d > now) break;
      keys.push(dateKey(d));
    }
    return keys;
  }
  const [year, month] = periodValue.split('-').map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();
  const now = new Date();
  const isCurrent = now.getFullYear()===year && (now.getMonth()+1)===month;
  const lastDay = isCurrent ? now.getDate() : daysInMonth;
  const keys = [];
  for(let d=1; d<=lastDay; d++){ keys.push(`${year}-${pad(month)}-${pad(d)}`); }
  return keys;
}
async function computeItemStats(keys, group){
  const students = studentsByGroup(group);
  const tasks = tasksByGroup(group);
  if(students.length===0 || tasks.length===0 || keys.length===0){
    return tasks.map(t=>({id:t.id, name:t.name, done:0, maxPossible:0, pct:0}));
  }
  const studentIds = new Set(students.map(s=>s.id));
  const counts = {};
  tasks.forEach(t=> counts[t.id]=0);
  const results = await Promise.all(keys.map(k=> storeGet(checklistKey(k))));
  results.forEach(obj=>{
    if(!obj) return;
    Object.keys(obj).forEach(sid=>{
      if(!studentIds.has(sid)) return;
      const entries = obj[sid]||{};
      Object.keys(entries).forEach(tid=>{
        if(counts[tid]!==undefined) counts[tid]++;
      });
    });
  });
  const maxPossible = students.length * keys.length;
  const rows = tasks.map(t=>{
    const done = counts[t.id]||0;
    const pct = maxPossible ? Math.round(done/maxPossible*1000)/10 : 0;
    return { id:t.id, name:t.name, done, maxPossible, pct };
  });
  rows.sort((a,b)=> a.pct-b.pct || a.name.localeCompare(b.name));
  return rows;
}
async function computeTrend(keys, group){
  if(keys.length===0) return [];
  const students = studentsByGroup(group);
  const total = tasksByGroup(group).length;
  const results = await Promise.all(keys.map(k=> storeGet(checklistKey(k))));
  const maxPerDay = students.length * (total||1);
  return keys.map((k,i)=>{
    const obj = results[i] || {};
    let doneSum = 0;
    students.forEach(s=>{ doneSum += Object.keys(obj[s.id]||{}).length; });
    const pct = maxPerDay ? Math.round(doneSum/maxPerDay*1000)/10 : 0;
    return { date:k, pct };
  });
}
async function computeCalendar(studentId, ym, total){
  const [year, month] = ym.split('-').map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();
  const now = new Date();
  const isCurrent = now.getFullYear()===year && (now.getMonth()+1)===month;
  const lastDay = isCurrent ? now.getDate() : daysInMonth;
  const keys = [];
  for(let d=1; d<=daysInMonth; d++){ keys.push(`${year}-${pad(month)}-${pad(d)}`); }
  const results = await Promise.all(keys.map(k=> storeGet(checklistKey(k))));
  return keys.map((k,i)=>{
    const dayNum = i+1;
    if(dayNum > lastDay) return { date:k, day:dayNum, status:'future' };
    const obj = results[i];
    const doneN = obj && obj[studentId] ? Object.keys(obj[studentId]).length : 0;
    let status;
    if(doneN===0) status = 'none';
    else if(total && doneN>=total) status = 'full';
    else status = 'partial';
    return { date:k, day:dayNum, status, doneN, total };
  });
}
async function computeStreak(studentId, total){
  if(!total) return 0;
  const now = new Date();
  const days = [];
  for(let i=0;i<60;i++){
    const d = new Date(now); d.setDate(now.getDate()-i);
    days.push(dateKey(d));
  }
  const results = await Promise.all(days.map(k=> storeGet(checklistKey(k))));
  const doneCounts = results.map(obj=> obj && obj[studentId] ? Object.keys(obj[studentId]).length : 0);
  let idx = 0;
  if(doneCounts[0] < total) idx = 1;
  let streak = 0;
  for(; idx<doneCounts.length; idx++){
    if(doneCounts[idx] >= total) streak++;
    else break;
  }
  return streak;
}
async function loadProfile(child, ym){
  const [{rows}, streak] = await Promise.all([
    computeMonthly(ym),
    computeStreak(child.id, tasksByGroup(child.group).length)
  ]);
  const row = rows.find(r=>r.id===child.id);
  const groupRows = rows.filter(r=>r.group===child.group);
  const isTop = groupRows.length>0 && groupRows[0].id===child.id && row && row.pct>0;
  state.profileResult = {ym, row, isTop};
  state.streakCount = streak;
  render();
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhotoToDrive(file, fileName){
  if(!state.appScriptUrl){ showToast('URL Apps Script belum diatur di menu Pengaturan'); return null; }
  try{
    const base64 = await fileToBase64(file);
    const res = await fetch(state.appScriptUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ image: base64, fileName, mimeType: file.type || 'image/jpeg' })
    });
    const data = await res.json();
    if(data && data.success) return data.url;
    console.error('Upload gagal', data && data.error);
    return null;
  }catch(e){
    console.error('Upload error', e);
    return null;
  }
}

function renderCalendarGrid(student, calData, ym){
  const [year,month] = ym.split('-').map(Number);
  const firstDow = new Date(year, month-1, 1).getDay();
  const leadBlanks = (firstDow+6)%7;
  const dowLabels = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
  const cells = [];
  for(let i=0;i<leadBlanks;i++) cells.push('<div></div>');
  calData.forEach(d=>{
    let cls='future', title='Belum waktunya';
    if(d.status==='full'){ cls='full'; title=`Lengkap (${d.doneN}/${d.total})`; }
    else if(d.status==='partial'){ cls='partial'; title=`Sebagian (${d.doneN}/${d.total})`; }
    else if(d.status==='none'){ cls='none'; title='Tidak mengisi'; }
    cells.push(`<div class="cal-cell ${cls}" title="${title}">${d.day}</div>`);
  });
  return `
  <div class="card">
    <div class="row between" style="margin-bottom:10px;">
      <h3 style="margin:0;font-size:14.5px;">📅 Riwayat ${student.name} — ${monthLabelId(ym)}</h3>
      <button class="icon-btn" id="closeCalendarBtn">✕</button>
    </div>
    <div class="cal-dow-row">${dowLabels.map(l=>`<div>${l}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="row" style="gap:12px;margin-top:12px;flex-wrap:wrap;">
      <span class="cal-legend"><i class="full"></i> Lengkap</span>
      <span class="cal-legend"><i class="partial"></i> Sebagian</span>
      <span class="cal-legend"><i class="none"></i> Tidak mengisi</span>
    </div>
  </div>`;
}

function renderComparisonCard(banin, banat){
  let verdict;
  if(banin.n===0 && banat.n===0){
    verdict = 'Belum ada data santri untuk dibandingkan.';
  } else if(banin.avgPct===banat.avgPct){
    verdict = 'Kelas Banin dan Banat seimbang — rata-rata nilai sama pada periode ini.';
  } else {
    const baninWins = banin.avgPct>banat.avgPct;
    const winnerLabel = baninWins?'Banin':'Banat';
    const diff = Math.round(Math.abs(banin.avgPct-banat.avgPct)*10)/10;
    verdict = `Kelas <b>${winnerLabel}</b> lebih rajin pada periode ini, unggul ${diff}% dibanding kelas lainnya.`;
  }
  return `
  <div class="card">
    <div class="section-title" style="margin-top:0;">🏆 Perbandingan Kelas Terrajin</div>
    <p style="margin:0;font-size:14.5px;line-height:1.5;">${verdict}</p>
  </div>`;
}
function renderMissedItemsCard(label, items){

  return `

}
function renderTrendChart(trendBanin, trendBanat){
  const n = Math.max(trendBanin.length, trendBanat.length);
  if(n===0) return '<div class="empty">Belum ada data tren untuk periode ini.</div>';
  const w=600, h=220, padL=32, padR=8, padT=14, padB=22;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const xFor = (i)=> padL + (n<=1?0:(i/(n-1))*plotW);
  const yFor = (pct)=> padT + plotH - (pct/100)*plotH;
  const toPath = (data)=> data.length? data.map((d,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yFor(d.pct).toFixed(1)}`).join(' ') : '';
  const gridLines = [0,25,50,75,100].map(v=>`
    <line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w-padR}" y2="${yFor(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL-6}" y="${(yFor(v)+3.5).toFixed(1)}" font-size="10" fill="var(--ink-soft)" text-anchor="end">${v}%</text>
  `).join('');
  const fmtShort = (iso)=>{ if(!iso) return ''; const p=iso.split('-'); return `${p[2]}/${p[1]}`; };
  const firstLabel = fmtShort((trendBanin[0]||trendBanat[0]||{}).date);
  const lastLabel = fmtShort((trendBanin[trendBanin.length-1]||trendBanat[trendBanat.length-1]||{}).date);
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    ${gridLines}
    ${trendBanin.length?`<path d="${toPath(trendBanin)}" fill="none" stroke="var(--teal)" stroke-width="2.5"/>`:''}
    ${trendBanat.length?`<path d="${toPath(trendBanat)}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`:''}
    <text x="${padL}" y="${h-6}" font-size="10" fill="var(--ink-soft)">${firstLabel}</text>
    <text x="${w-padR}" y="${h-6}" font-size="10" fill="var(--ink-soft)" text-anchor="end">${lastLabel}</text>
  </svg>
  <div class="row" style="gap:14px;margin-top:8px;">
    <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block;"></span>Banin</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block;"></span>Banat</div>
  </div>`;
}

}

    document.getElementById('addStudentBtn').onclick = doAdd;
    document.getElementById('newStudentName').addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
    document.querySelectorAll('[data-del-student]').forEach(el=>{ el.onclick = ()=> deleteStudent(el.dataset.delStudent); });
  }
  if(state.adminTab==='tasks'){
    ['banin','banat'].forEach(g=>{
      const btn = document.querySelector(`[data-add-task="${g}"]`);
      const input = document.getElementById(`newTask-${g}`);
      if(btn && input){
        const doAdd = ()=> addTask(input.value, g);
        btn.onclick = doAdd;
        input.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
      }
    });
    document.querySelectorAll('[data-edit-task]').forEach(el=>{ el.onclick = ()=>{ state.editingTaskId = el.dataset.editTask; render(); }; });
    document.querySelectorAll('[data-cancel-task]').forEach(el=>{ el.onclick = ()=>{ state.editingTaskId = null; render(); }; });
    document.querySelectorAll('[data-save-task]').forEach(el=>{
      el.onclick = ()=>{ const id = el.dataset.saveTask; saveTaskEdit(id, document.getElementById(`editTaskInput-${id}`).value); };
    });
    document.querySelectorAll('[data-del-task]').forEach(el=>{ el.onclick = ()=> deleteTask(el.dataset.delTask); });
  }
  if(state.adminTab==='monthly'){
    const periodSelect = document.getElementById('recapPeriodSelect');
    if(periodSelect){
      periodSelect.onchange = ()=>{
        state.recapPeriod = periodSelect.value;
        state.monthlyResult = null;
        state.calendarStudentId = null;
        state.calendarResult = null;
        render();
      };
    }
    document.getElementById('showMonthlyBtn').onclick = async (e)=>{
      const period = state.recapPeriod || 'bulanan';
      e.target.textContent = 'Memuat…'; e.target.disabled = true;
      state.calendarStudentId = null;
      state.calendarResult = null;
      if(period==='bulanan'){
        const ym = document.getElementById('monthPicker').value;
        state.monthYear = ym;
        state.monthlyResult = await computeMonthly(ym);
      } else {
        const picked = document.getElementById('weekPicker').value;
        state.weekStart = mondayOf(picked);
        state.monthlyResult = await computeWeekly(state.weekStart);
      }
      render();
    };
    const copyBtn = document.getElementById('copyMonthlyWaBtn');
    if(copyBtn){
      copyBtn.onclick = async ()=>{
        const period = state.recapPeriod || 'bulanan';
        const text = period==='bulanan'
          ? buildAdminWaReport(state.monthlyResult.rows, state.monthYear || currentYm())
          : buildAdminWeeklyWaReport(state.monthlyResult.rows, state.weekStart || mondayOf(todayKey()));
        const ok = await copyToClipboard(text);
        showToast(ok ? 'Laporan disalin ke clipboard' : 'Gagal menyalin, coba lagi');
      };
    }
    document.querySelectorAll('[data-copy-student-wa]').forEach(el=>{
      el.onclick = async ()=>{
        const sid = el.dataset.copyStudentWa;
        const row = state.monthlyResult.rows.find(r=>r.id===sid);
        const student = state.students.find(s=>s.id===sid);
        if(!student || !row) return;
        const period = state.recapPeriod || 'bulanan';
        const periodValue = period==='bulanan' ? (state.monthYear || currentYm()) : (state.weekStart || mondayOf(todayKey()));
        const text = buildStudentWaReport(student, row, period, periodValue);
        const ok = await copyToClipboard(text);
        showToast(ok ? 'Laporan disalin ke clipboard' : 'Gagal menyalin, coba lagi');
      };
    });
    document.querySelectorAll('[data-cal-student]').forEach(el=>{
      el.onclick = async ()=>{
        const sid = el.dataset.calStudent;
        if(state.calendarStudentId===sid){ state.calendarStudentId=null; state.calendarResult=null; render(); return; }
        state.calendarStudentId = sid;
        state.calendarResult = null;
        render();
        const student = state.students.find(s=>s.id===sid);
        const ym = state.monthYear || currentYm();
        const total = tasksByGroup(student.group).length;
        const data = await computeCalendar(sid, ym, total);
        if(state.calendarStudentId===sid){
          state.calendarResult = { studentId: sid, ym, data };
          render();
        }
      };
    });
    const closeCalBtn = document.getElementById('closeCalendarBtn');
    if(closeCalBtn){
      closeCalBtn.onclick = ()=>{ state.calendarStudentId=null; state.calendarResult=null; render(); };
    }
  }
  if(state.adminTab==='analytics'){
    const periodSelect = document.getElementById('analyticsPeriodSelect');
    if(periodSelect){
      periodSelect.onchange = ()=>{
        state.analyticsPeriod = periodSelect.value;
        state.analyticsResult = null;
        state.analyticsItemStats = null;
        state.analyticsTrend = null;
        render();
      };
    }
    const showBtn = document.getElementById('showAnalyticsBtn');
    if(showBtn){
      showBtn.onclick = async (e)=>{
        const period = state.analyticsPeriod || 'bulanan';
        e.target.textContent = 'Memuat…'; e.target.disabled = true;
        let periodValue;
        if(period==='bulanan'){
          periodValue = document.getElementById('analyticsMonthPicker').value;
          state.analyticsMonthYear = periodValue;
        } else {
          const picked = document.getElementById('analyticsWeekPicker').value;
          periodValue = mondayOf(picked);
          state.analyticsWeekStart = periodValue;
        }
        state.analyticsItemStats = null;
        state.analyticsTrend = null;
        const keys = keysForPeriod(period, periodValue);
        const [monthlyOrWeekly, baninItems, banatItems, baninTrend, banatTrend] = await Promise.all([
          period==='bulanan' ? computeMonthly(periodValue) : computeWeekly(periodValue),
          computeItemStats(keys, 'banin'),
          computeItemStats(keys, 'banat'),
          computeTrend(keys, 'banin'),
          computeTrend(keys, 'banat')
        ]);
        state.analyticsResult = monthlyOrWeekly;
        state.analyticsItemStats = { banin: baninItems, banat: banatItems };
        state.analyticsTrend = { banin: baninTrend, banat: banatTrend };
        render();
      };
    }
  }
  if(state.adminTab==='saran'){
    document.querySelectorAll('[data-saranfilter]').forEach(btn=>{
      btn.onclick = ()=>{ state.saranFilter = btn.dataset.saranfilter; render(); };
    });
    document.querySelectorAll('[data-toggle-saran]').forEach(btn=>{
      btn.onclick = ()=> markSaranRead(btn.dataset.toggleSaran, btn.dataset.read==='1');
    });
    document.querySelectorAll('[data-del-saran]').forEach(btn=>{
      btn.onclick = ()=>{ if(confirm('Hapus saran ini?')) deleteSaran(btn.dataset.delSaran); };
    });
  }
  if(state.adminTab==='settings'){
    document.getElementById('saveCredsBtn').onclick = ()=>{
      const newCreds = {};
      ['admin','banin','banat'].forEach(key=>{
        newCreds[key] = {
          id: document.getElementById(`cred-${key}-id`).value.trim() || DEFAULT_CREDENTIALS[key].id,
          password: document.getElementById(`cred-${key}-pw`).value || DEFAULT_CREDENTIALS[key].password
        };
      });
      saveCredentialsAction(newCreds);
    };
    document.getElementById('saveAppScriptBtn').onclick = async ()=>{
      const url = document.getElementById('appScriptUrlInput').value.trim();
      state.appScriptUrl = url;
      await storeSet('appscript-url', url);
      showToast('URL Apps Script tersimpan');
    };
  }
}

/* ================= Parent ================= */
function renderPeringkatBlock(group, highlightId){
  const label = group==='banin'?'Banin':'Banat';
  const period = state.peringkatPeriod || 'harian';
  const periodTabs = `
  <div class="row" style="gap:6px;margin-bottom:12px;">
    <button class="period-chip ${period==='harian'?'active':''}" data-pperiod="harian">Harian</button>
    <button class="period-chip ${period==='mingguan'?'active':''}" data-pperiod="mingguan">Mingguan</button>
    <button class="period-chip ${period==='bulanan'?'active':''}" data-pperiod="bulanan">Bulanan</button>
  </div>`;

  let rowsForDisplay;
  let periodTitle;
  if(period==='harian'){
    const top = activeRankList(group,5);
    periodTitle = 'Papan Peringkat Hari Ini';
    if(top.length===0){
      return `
      ${periodTabs}
      <div class="section-title">${periodTitle} — ${label}</div>
      <div class="card"><div class="empty">Belum ada santri yang mengisi hari ini.<br>Jadilah yang pertama! 🌟</div></div>`;
    }
    return `
    ${periodTabs}
    <div class="section-title">${periodTitle} — ${label}</div>
    <div class="card">
      ${top.map((s,i)=>{
        const pct = Math.round(s.pct*100);
        return `
        <div class="srow">
          <div class="rank-badge ${i===0?'gold':''}">${rankBadge(i)}</div>
          <div class="sname">${s.name}${s.id===highlightId?' <span class="pill teal">Anak Anda</span>':''}</div>
          <div class="sprog"><div style="width:${pct}%;"></div></div>
          <div class="sfrac">${s.done}/${s.total}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  periodTitle = period==='mingguan' ? 'Papan Peringkat Minggu Ini' : 'Papan Peringkat Bulan Ini';
  if(!state.peringkatResult || state.peringkatResult.period!==period){
    return `
    ${periodTabs}
    <div class="section-title">${periodTitle} — ${label}</div>
    <div class="card"><div class="empty">Memuat peringkat…</div></div>`;
  }
  const top = state.peringkatResult.rows.filter(r=>r.group===group && r.pct>0).slice(0,5);
  if(top.length===0){
    return `
    ${periodTabs}
    <div class="section-title">${periodTitle} — ${label}</div>
    <div class="card"><div class="empty">Belum ada data amaliyah pada periode ini.</div></div>`;
  }
  return `
  ${periodTabs}
  <div class="section-title">${periodTitle} — ${label}</div>
  <div class="card">
    ${top.map((s,i)=>`
      <div class="srow">
        <div class="rank-badge ${i===0?'gold':''}">${rankBadge(i)}</div>
        <div class="sname">${s.name}${s.id===highlightId?' <span class="pill teal">Anak Anda</span>':''}</div>
        <div class="sprog"><div style="width:${s.pct}%;"></div></div>
        <div class="sfrac">${s.pct}%</div>
      </div>`).join('')}
  </div>`;
}
function renderParentPilih(group){
  const list = studentsByGroup(group);
  return `
  <div class="section-title">Pilih nama anak Anda</div>
  <div class="card">
    ${list.length===0?'<div class="empty">Belum ada data santri.</div>':list.map(s=>`
      <div class="srow clickable" data-pick-child="${s.id}">
        <div class="sname">${s.name}</div><div class="muted">›</div>
      </div>`).join('')}
  </div>`;
}
function renderParentCeklis(child){
  const list = tasksByGroup(child.group);
  const entries = doneEntries(child.id);
  const done = doneCount(child.id);
  const total = list.length;
  const streak = state.streakCount || 0;
  return `
  ${streak>0?`<div class="streak-badge">🔥 ${streak} hari berturut-turut mengisi lengkap!</div>`:''}
  <div class="honesty-banner">
    <div class="ic">🤲</div>
    <div class="txt"><b>Sebelum menceklis…</b>Pastikan yang Anda centang benar-benar sudah dikerjakan anak. Kejujuran orang tua adalah teladan pertama bagi kejujuran anak.</div>
  </div>
  <div class="section-title">Ceklis Amaliyah Hari Ini (${done}/${total})</div>
  <div class="card">
    ${list.length===0?'<div class="empty">Admin belum menambahkan amaliyah untuk kelompok ini.</div>':list.map(t=>{
      const entry = entries[t.id]; const isDone = !!entry; const photo = entry && entry.photo;
      return `
      <div class="task-item">
        <div class="chk ${isDone?'done':''}" data-toggle-task="${t.id}"></div>
        <div class="task-label ${isDone?'done':''}">${t.name}</div>
        ${isDone?`<div class="task-time">${fmtTime(entry.time)}</div>`:''}
        <label class="cam-btn" title="${photo?'Ganti foto bukti':'Tambah foto bukti'}">
          ${photo?'📷✓':'📷'}
          <input type="file" accept="image/*" capture="environment" class="cam-input" data-photo-task="${t.id}">
        </label>
        ${photo?`<a href="${photo}" target="_blank" rel="noopener" class="photo-link">Lihat foto</a>`:''}
      </div>`;
    }).join('')}
  </div>
  <p class="muted" style="margin:-6px 0 0;">Ceklis otomatis dicatat waktunya, dan direset setiap hari.</p>`;
}
function renderParentNilai(child){
  const ym = state.profileMonth || currentYm();
  const totalHarian = tasksByGroup(child.group).length;
  let content = '<div class="empty">Memuat nilai bulan ini…</div>';
  if(state.profileResult && state.profileResult.ym===ym && state.profileResult.row){
    const row = state.profileResult.row;
    const letter = gradeLetter(row.pct);
    const approxDays = totalHarian ? Math.round(row.maxPossible/totalHarian) : 0;
    content = `
    ${state.profileResult.isTop?`<div class="teladan-banner">🌟 <b>Selamat!</b> Ananda ${child.name} menjadi Santri Teladan Kelas ${child.group==='banin'?'Banin':'Banat'} bulan ini.</div>`:''}
    <div class="card grade-card">
      <div class="grade-letter">${letter}</div>
      <div class="muted" style="margin-top:4px;">${gradeDesc(letter)}</div>
      <div style="margin-top:14px;font-size:14px;">${row.pct}% amaliyah terlaksana (${row.doneSum}/${row.maxPossible})</div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:14.5px;">Dari mana nilai ini didapat?</h3>
      <p class="muted" style="margin:0 0 10px;line-height:1.55;">Nilai dihitung dari persentase ceklis amaliyah yang berhasil diisi dibanding total amaliyah yang mungkin diisi selama ${monthLabelId(ym)}.</p>
      <div class="detail-row"><span>Amaliyah harian ananda</span><b>${totalHarian} item/hari</b></div>
      <div class="detail-row"><span>Jumlah hari terhitung</span><b>${approxDays} hari</b></div>
      <div class="detail-row"><span>Total kemungkinan bulan ini</span><b>${row.maxPossible}</b></div>
      <div class="detail-row"><span>Total yang tercentang</span><b>${row.doneSum}</b></div>
      <div class="detail-row"><span>Persentase</span><b>${row.pct}%</b></div>
      <p class="muted" style="margin:10px 0 0;">Skala nilai: A ≥ 90%, B ≥ 75%, C ≥ 60%, D &lt; 60%.</p>
    </div>`;
  }
  return `
  <div class="section-title">Nilai Bulan Ini</div>
  <div class="card">
    <div class="row">
      <input type="month" id="profileMonthPicker" value="${ym}" style="max-width:200px;">
      <button class="btn btn-primary" id="loadProfileBtn">Lihat bulan lain</button>
    </div>
  </div>
  ${content}`;
}
function renderParentCeklisDanNilai(child){
  return `
  ${renderParentCeklis(child)}
  ${renderParentNilai(child)}`;
}

function renderParentSaran(child){
  const mine = state.saranList.filter(s=>s.studentId===child.id);
  return `
  <div class="section-title">Kotak Saran &amp; Masukan</div>
  <div class="card">
    <p class="muted" style="margin:0 0 12px;line-height:1.55;">Ada saran, masukan, atau hal yang ingin disampaikan ke sekolah terkait ananda <b>${child.name}</b>? Silakan tulis di sini, pesan akan langsung diterima pihak sekolah.</p>
    <div class="field">
      <label>Pesan Anda</label>
      <textarea id="saranMessage" rows="4" placeholder="Tulis saran atau masukan di sini..."></textarea>
    </div>
    <button class="btn btn-primary btn-block" id="submitSaranBtn">Kirim</button>
  </div>
  <div class="section-title">Riwayat Pesan Anda</div>
  <div class="card">
    ${mine.length===0 ? '<div class="empty">Belum ada pesan yang dikirim.</div>' : mine.map(s=>`
      <div class="saran-item">
        <div class="muted" style="font-size:12px;">${fmtDateTime(s.createdAt)}</div>
        <p class="saran-msg">${escapeHtml(s.message).replace(/\n/g,'<br>')}</p>
      </div>`).join('')}
  </div>`;
}

function renderParent(){
  const group = state.role;
  if(!state.selectedChildId){
    const tabs = [['peringkat','Papan Peringkat'],['pilih','Pilih Anak']];
    const body = state.parentTab==='pilih' ? renderParentPilih(group) : renderPeringkatBlock(group, null);
    return `
    ${renderTopbar()}
    ${renderSidebar(tabs, state.parentTab, 'ptab')}
    <div class="wrap" style="padding-top:20px;">${body}</div>`;
  }
  const child = state.students.find(s=>s.id===state.selectedChildId);
  if(!child){ state.selectedChildId=null; state.parentTab='peringkat'; return renderParent(); }
  if(!['ceklis','peringkat','saran'].includes(state.parentTab)) state.parentTab='ceklis';
  const tabs = [['ceklis','Ceklis & Nilai'],['peringkat','Papan Peringkat'],['saran','Saran & Masukan']];
  let body='';
  if(state.parentTab==='ceklis') body = renderParentCeklisDanNilai(child);
  else if(state.parentTab==='saran') body = renderParentSaran(child);
  else body = renderPeringkatBlock(group, child.id);
  return `
  ${renderTopbar()}
  ${renderSidebar(tabs, state.parentTab, 'ptab')}
  <div class="wrap" style="padding-top:20px;">
    <div class="card row between">
      <div style="font-weight:600;font-size:15px;">${child.name}</div>
      <button class="btn btn-ghost btn-sm" id="switchChild">Ganti anak</button>
    </div>
    ${body}
  </div>`;
}
function attachParentEvents(){
  attachSidebarEvents();
  document.getElementById('logoutBtn').onclick = doLogout;
  document.querySelectorAll('[data-pick-child]').forEach(el=>{
    el.onclick = ()=>{
      state.selectedChildId = el.dataset.pickChild;
      state.parentTab = 'ceklis';
      state.profileMonth = currentYm();
      state.profileResult = null;
      render();
      loadProfile(state.students.find(s=>s.id===state.selectedChildId), state.profileMonth);
    };
  });
  const switchBtn = document.getElementById('switchChild');
  if(switchBtn) switchBtn.onclick = ()=>{ state.selectedChildId=null; state.parentTab='peringkat'; render(); };
  document.querySelectorAll('[data-ptab]').forEach(el=>{
    el.onclick = ()=>{
      state.parentTab = el.dataset.ptab;
      if(state.parentTab==='ceklis' && state.selectedChildId){
        const ym = state.profileMonth || currentYm();
        if(!state.profileResult || state.profileResult.ym!==ym){
          render();
          loadProfile(state.students.find(s=>s.id===state.selectedChildId), ym);
          return;
        }
      }
      render();
    };
  });
  document.querySelectorAll('[data-toggle-task]').forEach(el=>{
    el.onclick = ()=> toggleTask(state.selectedChildId, el.dataset.toggleTask);
  });
  document.querySelectorAll('[data-photo-task]').forEach(el=>{
    el.onchange = (e)=>{
      const file = e.target.files[0];
      if(file) attachTaskPhoto(state.selectedChildId, el.dataset.photoTask, file);
    };
  });
  document.querySelectorAll('[data-pperiod]').forEach(el=>{
    el.onclick = async ()=>{
      const period = el.dataset.pperiod;
      state.peringkatPeriod = period;
      if(period==='harian'){ render(); return; }
      if(state.peringkatResult && state.peringkatResult.period===period){ render(); return; }
      render();
      const result = period==='mingguan' ? await computeWeekly(mondayOf(todayKey())) : await computeMonthly(currentYm());
      state.peringkatResult = {period, rows: result.rows};
      render();
    };
  });
  const loadBtn = document.getElementById('loadProfileBtn');
  if(loadBtn) loadBtn.onclick = ()=>{
    const ym = document.getElementById('profileMonthPicker').value;
    state.profileMonth = ym;
    const child = state.students.find(s=>s.id===state.selectedChildId);
    render();
    loadProfile(child, ym);
  };
  const submitSaranBtn = document.getElementById('submitSaranBtn');
  if(submitSaranBtn) submitSaranBtn.onclick = ()=>{
    const val = document.getElementById('saranMessage').value;
    if(!val || !val.trim()) return;
    submitSaran(state.selectedChildId, val);
  };
}

/* ---------------- Boot ---------------- */
initApp();
</script>
